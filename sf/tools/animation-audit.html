<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>SF animation review</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #26342e;
      color: #f0ebdc;
      font: 15px system-ui;
    }
    header {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 24px;
    }
    button,
    select,
    input {
      font: inherit;
    }
    canvas {
      width: 100vw;
      height: calc(100vh - 64px);
      display: block;
    }
    #labels {
      position: absolute;
      inset: 64px 0 0;
      pointer-events: none;
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    }
    #labels div {
      padding: 10px 20px;
      border: 1px solid #ffffff14;
    }
    small {
      color: #bacbbd;
    }
    #time {
      width: 170px;
    }
  </style>
  <header>
    <strong>Native animation review</strong
    ><select id="page"></select
    ><select id="clothes">
      <option value="regular">Regular clothes</option>
      <option value="cloak">Black cloak</option>
      <option value="top">Cloak top</option>
      <option value="bottom">Cloak bottom</option></select
    ><button id="pause">Pause</button
    ><input id="time" type="range" min="0" max="6" step=".01" value="0" /><small id="status"
      >Loading meshes…</small
    >
  </header>
  <canvas></canvas>
  <div id="labels"></div>
  <script type="module">
    import { Mesh, matrixMultiply, unit, sub, cross, dot } from '../geometry.js';
    import { drawRemotePlayer } from '../remote-player-models.js';
    import { createActorAnimation } from '../animation-presentation.js';
    import { characterAppearance, normalizeCharacter } from '../character-config.js';
    import { createLoadingNPCMesh } from '../loading-npc.js';
    import { drawBison } from '../bison-model.js';
    import { SF_FITNESS } from '../southern-layout.js';
    const clips = [
      ['Walk', 'walk'],
      ['Dance', 'dance'],
      ['Bicycle', 'bike'],
      ['Forward roll', 'roll'],
      ['Sit / stand', 'sit'],
      ['Railgun', 'walk', 'attack'],
      ['Capture', 'walk', 'caught'],
      ['Gondola', 'gondola'],
      ['Ski / flip', 'ski'],
      ['Motorcycle', 'motorcycle'],
      ['Ferrari', 'ferrari'],
      ['Skateboard', 'skateboard'],
      ['Windsurf', 'surf', 'windsurf'],
      ['Paddle', 'surf', 'paddle'],
      ['Surfboard', 'surf', 'surfboard'],
      ['B-2 barrel roll', 'bomber'],
      ['Parachute', 'parachute'],
      ['Teleport', 'teleport'],
      ['Pet bear', 'walk', 'pet-bear'],
      ['Drink', 'walk', 'drink'],
      ['Talk', 'walk', 'talk'],
      ['Work', 'walk', 'work'],
      ['Eat', 'walk', 'eat'],
      ['Fish', 'walk', 'fish'],
      ['Climb', 'climb'],
      ['Boxing', 'walk', 'attack'],
      ['Loading NPC', 'loading'],
      ['Bench press', 'train', 'bench'],
      ['Curls', 'train', 'curl'],
      ['Squats', 'train', 'squat'],
      ['Overhead press', 'train', 'press'],
      ['Bison', 'bison'],
    ];
    const canvas = document.querySelector('canvas'),
      gl = canvas.getContext('webgl', { antialias: true }),
      labels = document.querySelector('#labels'),
      page = document.querySelector('#page'),
      slider = document.querySelector('#time'),
      status = document.querySelector('#status');
    if (!gl) throw Error('WebGL unavailable');
    for (let i = 0; i < Math.ceil(clips.length / 9); i++)
      page.add(
        new Option(
          ['Movement & transitions', 'Vehicles & travel', 'Gestures & loading', 'Gym'][i],
          i,
        ),
      );
    function shader(type, source) {
      const s = gl.createShader(type);
      gl.shaderSource(s, source);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(s));
      return s;
    }
    const program = gl.createProgram();
    gl.attachShader(
      program,
      shader(
        gl.VERTEX_SHADER,
        'attribute vec3 aPosition,aNormal,aColor;uniform mat4 uVP;varying vec3 color;void main(){color=aColor*(.6+.4*max(0.,dot(normalize(aNormal),normalize(vec3(-.45,.85,.55)))));gl_Position=uVP*vec4(aPosition,1.);}',
      ),
    );
    gl.attachShader(
      program,
      shader(
        gl.FRAGMENT_SHADER,
        'precision mediump float;varying vec3 color;void main(){gl_FragColor=vec4(color,1.);}',
      ),
    );
    for (const [i, name] of ['aPosition', 'aNormal', 'aColor'].entries())
      gl.bindAttribLocation(program, i, name);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS))
      throw Error(gl.getProgramInfoLog(program));
    const buffer = gl.createBuffer(),
      vp = gl.getUniformLocation(program, 'uVP'),
      loading = createLoadingNPCMesh();
    let animations = [],
      last = 0,
      started = performance.now(),
      paused = false,
      frames = 0,
      total = 0;
    function reset() {
      animations = Array.from({ length: 9 }, () => createActorAnimation());
      labels.replaceChildren(
        ...clips
          .slice(page.value * 9, page.value * 9 + 9)
          .map(([name]) => Object.assign(document.createElement('div'), { textContent: name })),
      );
      started = performance.now();
      slider.value = 0;
    }
    page.onchange = reset;
    document.querySelector('#pause').onclick = () => {
      paused = !paused;
      document.querySelector('#pause').textContent = paused ? 'Play' : 'Pause';
      started = performance.now() - Number(slider.value) * 1000;
    };
    slider.oninput = () => {
      paused = true;
      animations = Array.from({ length: 9 }, () => createActorAnimation());
      document.querySelector('#pause').textContent = 'Play';
    };
    function draw(now) {
      const t = paused ? Number(slider.value) : (now - started) / 1000;
      slider.value = t % 6;
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      gl.enable(gl.DEPTH_TEST);
      gl.clearColor(0.15, 0.2, 0.18, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.useProgram(program);
      const cellW = Math.floor(canvas.width / 3),
        cellH = Math.floor(canvas.height / 3),
        eye = [3, 2.4, 4],
        target = [0, 1.02, 0],
        b = unit(sub(eye, target)),
        r = unit(cross([0, 1, 0], b)),
        u = cross(b, r),
        view = new Float32Array([
          r[0],
          u[0],
          b[0],
          0,
          r[1],
          u[1],
          b[1],
          0,
          r[2],
          u[2],
          b[2],
          0,
          -dot(r, eye),
          -dot(u, eye),
          -dot(b, eye),
          1,
        ]);
      total = 0;
      for (let i = 0; i < 9; i++) {
        const clip = clips[page.value * 9 + i];
        if (!clip) continue;
        const [name, mode, gesture = ''] = clip,
          loop = t % 2,
          at = t * 1000;
        const moving = ['Walk', 'Bicycle', 'Motorcycle', 'Ferrari', 'Skateboard', 'Climb'].includes(
          name,
        );
        const p = {
          id: 1,
          x: 0,
          y: 0,
          z: 0,
          angle: 0,
          phase:
            mode === 'roll'
              ? (loop / 2) * Math.PI * 2
              : mode === 'surf'
                ? 0
                : mode === 'bomber'
                  ? t * 0.8
                  : mode === 'ski'
                    ? t * Math.PI
                    : mode === 'climb'
                      ? t * 3.2
                      : moving
                        ? t * 5
                        : 0,
          motion: Number(moving),
          moving,
          mode: mode === 'sit' && loop > 1 ? 'walk' : mode,
          hp: 30,
          max: 30,
          gesture:
            gesture === 'caught'
              ? loop < 1.9
                ? gesture
                : ''
              : loop < 0.2
                ? gesture
                : [
                      'bench',
                      'curl',
                      'squat',
                      'press',
                      'windsurf',
                      'paddle',
                      'surfboard',
                      'fish',
                    ].includes(gesture)
                  ? gesture
                  : '',
        };
        const a = animations[i].sample(p, at),
          look = characterAppearance(
            normalizeCharacter({
              weapon: name === 'Railgun' ? 'railgun' : 'unarmed',
              torso: ['cloak', 'top'].includes(document.querySelector('#clothes').value)
                ? 'black-cloak-top'
                : 'shirt',
              legs: ['cloak', 'bottom'].includes(document.querySelector('#clothes').value)
                ? 'black-cloak-bottom'
                : 'trousers',
            }),
          );
        let m = new Mesh();
        if (mode === 'loading') m = loading(t * 3);
        else if (mode === 'bison')
          drawBison(m, { x: 0, z: 0, base: 0, angle: 0, motion: 1, phase: t * 2 }, at);
        else drawRemotePlayer(m, p, at, { look, animation: a });
        if (mode === 'train')
          for (let k = 0; k < m.data.length; k += 11) {
            m.data[k] -= SF_FITNESS.x;
            m.data[k + 1] -= SF_FITNESS.base;
            m.data[k + 2] -= SF_FITNESS.z;
          }
        const half = ['surf', 'gondola', 'bomber'].includes(mode) ? 2.1 : 1.35,
          projection = new Float32Array([
            cellH / cellW / half,
            0,
            0,
            0,
            0,
            1 / half,
            0,
            0,
            0,
            0,
            -0.03,
            0,
            0,
            0,
            0,
            1,
          ]);
        gl.viewport((i % 3) * cellW, (2 - Math.floor(i / 3)) * cellH, cellW, cellH);
        gl.uniformMatrix4fv(vp, false, matrixMultiply(projection, view));
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(m.data), gl.DYNAMIC_DRAW);
        for (let k = 0; k < 3; k++) {
          gl.enableVertexAttribArray(k);
          gl.vertexAttribPointer(k, 3, gl.FLOAT, false, 44, k * 12);
        }
        gl.drawArrays(gl.TRIANGLES, 0, m.data.length / 11);
        total += m.data.length / 33;
      }
      frames++;
      status.textContent = `${Math.round(total).toLocaleString()} triangles · ${gl.getError() === 0 ? 'WebGL OK' : 'WebGL error'}`;
      window.animationAudit = { frames, total, clips: clips.length, time: t, ready: true };
      last = now;
      requestAnimationFrame(draw);
    }
    reset();
    requestAnimationFrame(draw);
  </script>
</html>
