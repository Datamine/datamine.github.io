<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Loeberland database editor</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f6f8;
        color: #19202c;
        font:
          15px system-ui,
          sans-serif;
      }
      header {
        padding: 20px 24px;
        background: #fff;
        border-bottom: 1px solid #dce0e6;
      }
      h1 {
        font-size: 21px;
        margin: 0 0 6px;
      }
      p {
        margin: 6px 0;
        color: #536071;
      }
      .notice {
        padding: 12px 24px;
        background: #fff3d7;
        color: #634509;
      }
      .layout {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        height: calc(100dvh - 150px);
        min-height: 420px;
      }
      aside {
        padding: 16px;
        border-right: 1px solid #dce0e6;
        overflow: auto;
      }
      main {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      input,
      button,
      textarea {
        font: inherit;
      }
      input {
        padding: 10px;
        width: 100%;
        border: 1px solid #b9c2cf;
        border-radius: 6px;
      }
      button {
        cursor: pointer;
        padding: 9px 14px;
        border: 1px solid #b9c2cf;
        background: #fff;
        border-radius: 6px;
        color: inherit;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.primary {
        background: #235bd6;
        color: #fff;
        border-color: #235bd6;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      #records {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 12px;
      }
      #records button {
        text-align: left;
        overflow-wrap: anywhere;
      }
      #records button.active {
        border-color: #235bd6;
        background: #e8efff;
      }
      small {
        display: block;
        color: #647085;
        font-size: 11px;
        margin-top: 3px;
      }
      h2 {
        margin: 0;
        font-size: 17px;
        overflow-wrap: anywhere;
      }
      #key {
        overflow-wrap: anywhere;
        font-size: 12px;
      }
      textarea {
        flex: 1;
        min-height: 260px;
        resize: vertical;
        padding: 16px;
        border: 1px solid #b9c2cf;
        border-radius: 6px;
        background: #fff;
        tab-size: 2;
        font:
          14px/1.6 ui-monospace,
          SFMono-Regular,
          monospace;
        white-space: pre;
      }
      #status {
        min-height: 22px;
        overflow-wrap: anywhere;
      }
      #status.error {
        color: #b42318;
      }
      #status.success {
        color: #167043;
      }
      #source {
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      #count {
        margin: 12px 0;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #7aa2ff;
        outline-offset: 2px;
      }
      @media (max-width: 700px) {
        .layout {
          grid-template-columns: 1fr;
          height: auto;
        }
        aside {
          border-right: 0;
          border-bottom: 1px solid #dce0e6;
          max-height: 280px;
        }
        main {
          min-height: 65dvh;
        }
        header,
        .notice {
          padding: 14px 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Loeberland database editor</h1>
      <p id="source">Connecting…</p>
    </header>
    <div class="notice">__ADMIN_NOTICE__</div>
    <div class="layout">
      <aside>
        <label for="search">Find a record</label>
        <input id="search" type="search" placeholder="Username, player ID, or world…" />
        <p id="count"></p>
        <button id="refresh" type="button">Refresh list</button>
        <nav id="records" aria-label="Database records"></nav>
      </aside>
      <main>
        <h2 id="title">Choose a record</h2>
        <p id="key">Select a player, the world snapshot, or a username from the list.</p>
        <div class="toolbar">
          <button id="save" class="primary" disabled>Save changes</button>
          <button id="format" disabled>Format JSON</button>
          <button id="reload" disabled>Reload record</button>
          <span id="dirty"></span>
        </div>
        <label for="editor">Record value (JSON)</label>
        <textarea
          id="editor"
          spellcheck="false"
          disabled
          placeholder="The selected record will appear here."
        ></textarea>
        <div id="status" role="status" aria-live="polite"></div>
      </main>
    </div>
    <script>
      "use strict";
(() => {
  // types/ui.ts
  function requiredElement(id) {
    const value = document.getElementById(id);
    if (!value) throw new Error("Missing interface element: " + id);
    return value;
  }

  // types/json.ts
  function isRecord(value) {
    return value !== null && typeof value === "object" && !Array.isArray(value);
  }
  function errorMessage(error) {
    return error instanceof Error ? error.message : String(error);
  }

  // server/admin-ui.ts
  var token = "__ADMIN_TOKEN__";
  var readOnly = __ADMIN_READ_ONLY__;
  var $ = (id) => requiredElement(id);
  var records = [];
  var selected = null;
  var original = "";
  var baseline = "";
  var busy = false;
  function status(message, type = "") {
    $("status").textContent = message;
    $("status").className = type;
  }
  function changed() {
    return !readOnly && !!selected && $("editor").value !== baseline;
  }
  function controls() {
    $("save").disabled = readOnly || busy || !changed();
    $("save").hidden = readOnly;
    $("editor").readOnly = readOnly;
    for (const id of ["format", "reload"]) $(id).disabled = busy || !selected;
    $("editor").disabled = busy || !selected;
    $("refresh").disabled = busy;
    $("dirty").textContent = changed() ? "Unsaved changes" : "";
  }
  async function api(path, options = {}) {
    const response = await fetch("/api/" + path, {
      ...options,
      headers: { "X-Admin-Token": token, "Content-Type": "application/json" }
    });
    const result = await response.json();
    if (!response.ok)
      throw Error(
        isRecord(result) && typeof result.error === "string" ? result.error : "Request failed."
      );
    return result;
  }
  function draw() {
    const query = $("search").value.toLowerCase();
    const visible = records.filter(
      (row) => (row.label + " " + row.key + " " + row.kind).toLowerCase().includes(query)
    );
    $("count").textContent = visible.length + " of " + records.length + " records";
    $("records").replaceChildren();
    for (const row of visible) {
      const button = document.createElement("button");
      button.type = "button";
      button.disabled = busy;
      button.className = selected && row.kind === selected.kind && row.key === selected.key ? "active" : "";
      button.textContent = row.label;
      const detail = document.createElement("small");
      detail.textContent = row.kind + " \xB7 " + row.key;
      button.append(detail);
      button.onclick = () => load(row);
      $("records").append(button);
    }
  }
  async function refresh() {
    const data = await api("records");
    records = data.records;
    $("source").textContent = data.backend.toUpperCase() + " \xB7 " + data.location;
    draw();
  }
  async function load(row) {
    if (busy || changed() && !confirm("Discard unsaved changes?")) return;
    busy = true;
    controls();
    draw();
    try {
      const data = await api("record?" + new URLSearchParams({ kind: row.kind, key: row.key }));
      const formatted = JSON.stringify(JSON.parse(data.raw), null, 2);
      selected = row;
      original = data.raw;
      baseline = formatted;
      $("editor").value = baseline;
      $("title").textContent = row.label;
      $("key").textContent = row.kind + " \xB7 " + row.key;
      status(
        readOnly ? "Read-only inspection. Refresh or reload to see the latest saved checkpoint." : row.kind === "usernames" ? "For a rename, update name and canonical (lowercase). Keep owner unchanged. changed is a timestamp in milliseconds." : "Edit the JSON, then save. Changes are written directly to the database."
      );
    } catch (error) {
      status(errorMessage(error), "error");
    } finally {
      busy = false;
      controls();
      draw();
    }
  }
  $("save").onclick = async () => {
    busy = true;
    controls();
    draw();
    try {
      const value = JSON.parse($("editor").value);
      const data = await api("record", {
        method: "PUT",
        body: JSON.stringify({ ...selected, original, value })
      });
      original = data.raw;
      baseline = JSON.stringify(value, null, 2);
      $("editor").value = baseline;
      status("Saved. Restart the game server to load this change.", "success");
      try {
        await refresh();
      } catch (error) {
        status("Saved, but refreshing the list failed: " + errorMessage(error), "error");
      }
    } catch (error) {
      status(errorMessage(error), "error");
    } finally {
      busy = false;
      controls();
      draw();
    }
  };
  $("format").onclick = () => {
    try {
      $("editor").value = JSON.stringify(JSON.parse($("editor").value), null, 2);
      controls();
      status("JSON formatted.");
    } catch (error) {
      status(errorMessage(error), "error");
    }
  };
  $("reload").onclick = () => {
    if (selected) void load(selected);
  };
  $("refresh").onclick = () => refresh().catch((error) => status(errorMessage(error), "error"));
  $("search").oninput = draw;
  $("editor").oninput = controls;
  window.addEventListener("beforeunload", (event) => {
    if (changed()) {
      event.preventDefault();
      event.returnValue = "";
    }
  });
  controls();
  refresh().catch((error) => status(errorMessage(error), "error"));
})();

    </script>
  </body>
</html>
