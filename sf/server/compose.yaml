services:
  game:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    ports: ['127.0.0.1:8787:8787']
    environment:
      HOST: 0.0.0.0
      MAX_PLAYERS: 2000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://johnloeber.com,https://www.johnloeber.com,https://datamine.github.io}
      ALLOW_DEBUG: '0'
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CHECKPOINT_INTERVAL_MS: ${CHECKPOINT_INTERVAL_MS:-1000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
    volumes:
      - world-data:/app/server/data
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 1s
      retries: 15
  proxy:
    image: caddy:2-alpine
    profiles: [production]
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:-localhost}
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy-data:/data', 'caddy-config:/config']
    depends_on: [game]
volumes:
  world-data:
  redis-data:
  caddy-data:
  caddy-config:
